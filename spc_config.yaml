# ============================================================
# SPC统计分析工具 - 外部配置文件
# 版本: 1.0
# 说明: 支持多项目配置，每个项目独立定义CSV路径、输出路径和规格限
#
# 使用说明:
#   1. 修改 base_dir 为数据文件所在目录
#   2. 在 projects 下添加/修改项目配置
#   3. spec_limits 格式: 参数名: [LSL下限, USL上限]
#   4. 参数名必须与CSV文件中的列名完全一致
# ============================================================

version: "1.0"

# 所有相对路径的基础目录（可选，留空则使用当前目录）
